name: Build CI

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: |
          curl -fL -o toolchain.tar.xz https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -Jxf toolchain.tar.xz
      - name: Build kpimg
        run: make -C kernel TARGET_COMPILE="$GITHUB_WORKSPACE/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-" -j2
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b
      - name: Build Android tools
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          for component in tools user; do
            cmake -S "$component" -B "$component/build/android" -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" -DCMAKE_BUILD_TYPE=Release -DANDROID_PLATFORM=android-33 -DANDROID_ABI=arm64-v8a
            cmake --build "$component/build/android" -j2
          done
      - name: Collect binaries
        run: |
          mkdir -p out
          cp kernel/kpimg out/kpimg-linux
          cp tools/build/android/kptools out/kptools-android
          cp user/build/android/kpatch out/kpatch-android
      - uses: actions/upload-artifact@v4
        with:
          name: KPatch-Next-Pro-0.13.9-1-${{ github.sha }}
          path: out/
          if-no-files-found: error
