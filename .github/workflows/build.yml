name: Build CI

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install compiler
        run: |
          curl -fL -o toolchain.tar.xz https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -Jxf toolchain.tar.xz
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b
      - name: Build both engines
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: TARGET_COMPILE="$GITHUB_WORKSPACE/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-" bash build-engines.sh "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@v4
        with:
          name: KPatch-Next-Pro-engines-${{ github.sha }}
          path: out/
          if-no-files-found: error
